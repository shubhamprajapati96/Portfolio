name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java JDK (21 LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Angular Web App
        run: CI=true NG_CLI_ANALYTICS=false NG_FORCE_TTY=false npm run build

      - name: Add Capacitor Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Shubham-Portfolio.apk
          mkdir -p public/downloads src/assets/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/Shubham-Portfolio.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk src/assets/downloads/Shubham-Portfolio.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shubham-Portfolio-APK
          path: build-output/Shubham-Portfolio.apk

      - name: Commit and Push Latest APK to Website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/Shubham-Portfolio.apk src/assets/downloads/Shubham-Portfolio.apk
          git diff --quiet && git diff --staged --quiet || (git commit -m "build(apk): update latest Android APK [skip ci]" && git push origin HEAD:${{ github.ref }})
