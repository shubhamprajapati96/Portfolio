<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shubham Prajapati | Software Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0F19">
  <meta name="description" content="Portfolio of Shubham Prajapati, a Software Developer with 7 years of experience building scalable SaaS applications, microservices, and enterprise web platforms.">
  <meta property="og:title" content="Shubham Prajapati | Software Developer">
  <meta property="og:description" content="Software Developer specializing in Angular, React, Next.js, PHP, Laravel, Node.js, and Microservices Architecture.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://shubhamprajapati.dev/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <script>
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #070a13;
      color: #ffffff;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    [data-theme='light'], [data-theme='light'] body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    .app-shell-navbar {
      width: min(100% - clamp(1rem, 4vw, 3rem), 1200px);
      min-height: 4.5rem;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .app-shell-mark {
      display: grid;
      place-items: center;
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 0.75rem;
      background: linear-gradient(135deg, #38bdf8, #06b6d4);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      box-shadow: 0 8px 20px -2px rgba(56, 189, 248, 0.35);
    }
    .app-shell-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    [data-theme='light'] .app-shell-name {
      color: #0f172a;
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-shell-navbar" aria-hidden="true">
      <div class="app-shell-mark">SP</div>
      <div class="app-shell-name">Shubham Prajapati</div>
    </div>
  </app-root>
</body>
</html>
